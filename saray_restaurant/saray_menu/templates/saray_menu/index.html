{% extends 'saray_menu/layout.html' %}
{% load static %}

{% block body %}
    <div id="back_div" role="img" aria-label="فضای رستوران سارای"></div>
    <section aria-label="تصاویر رستوران">
        <div id="carouselExampleIndicators" class="carousel slide home-carousel" data-ride="carousel" dir="ltr">
            <ol class="carousel-indicators">
                <li data-target="#carouselExampleIndicators" data-slide-to="0" class="active"></li>
                <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
                <li data-target="#carouselExampleIndicators" data-slide-to="2"></li>
            </ol>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img class="d-block w-100" src="{% static 'saray_menu/slidebar1.jpg' %}" alt="تصویر اول رستوران سارای">
                </div>
                <div class="carousel-item">
                    <img class="d-block w-100" src="{% static 'saray_menu/slidebar2.jpg' %}" alt="تصویر دوم رستوران سارای">
                </div>
                <div class="carousel-item">
                    <img class="d-block w-100" src="{% static 'saray_menu/slidebar3.jpg' %}" alt="تصویر سوم رستوران سارای">
                </div>
            </div>
            <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="sr-only">تصویر قبلی</span>
            </a>
            <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="sr-only">تصویر بعدی</span>
            </a>
        </div>
    </section>
{% endblock %}
