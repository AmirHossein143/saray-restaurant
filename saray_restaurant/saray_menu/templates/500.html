{% load static %}<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#15110E">
  <title>خطای موقت | رستوران سارای</title>

</head>
<body class="page page--error page--500">

      <div class="btn-row btn-row--center">
        <a class="btn btn--primary" href="/">بازگشت به صفحه‌ی اصلی</a>
        <a class="btn btn--ghost-light" href="tel:+984136688554">تماس با رستوران</a>
      </div>
    </div>
  </main>
</body>
</html>
