{% load static %}<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Saray Data Studio</title>
  <link rel="icon" href="{% static 'saray_menu/img/brand/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'studio/studio.css' %}">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('studio-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-table" viewBox="0 0 24 24"><path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5Zm2 4v4h6V9H5Zm8 0v4h6V9h-6ZM5 15v4h6v-4H5Zm8 0v4h6v-4h-6ZM5 5v2h14V5H5Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7V4Z"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 17.25 9.9-9.9 2.75 2.75L6.75 20H4v-2.75Zm11.3-11.3 1.65-1.65a1 1 0 0 1 1.4 0l1.35 1.35a1 1 0 0 1 0 1.4L18.05 8.7 15.3 5.95Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 9Zm4 2v8h2v-8h-2Zm4 0v8h2v-8h-2Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M10 4a6 6 0 1 0 3.9 10.55l4.78 4.78 1.41-1.41-4.78-4.78A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4 6.4 5Z"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="m14.7 5.3-6.7 6.7 6.7 6.7 1.4-1.4-5.3-5.3 5.3-5.3-1.4-1.4Z"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9.3 5.3-1.4 1.4 5.3 5.3-5.3 5.3 1.4 1.4 6.7-6.7-6.7-6.7Z"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="m12 5 4 5H8l4-5Zm0 14-4-5h8l-4 5Z"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m12 5 6 7H6l6-7Z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m12 19-6-7h12l-6 7Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M12 5a7 7 0 0 1 6.32 4H16v2h6V5h-2v2.35A9 9 0 1 0 21 12h-2a7 7 0 1 1-7-7Z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M11 3h2v9.17l3.59-3.58L18 10l-6 6-6-6 1.41-1.41L11 12.17V3ZM5 18h14v2H5v-2Z"/></symbol>
    <symbol id="i-columns" viewBox="0 0 24 24"><path d="M4 5h4v14H4V5Zm6 0h4v14h-4V5Zm6 0h4v14h-4V5Z"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8L3 5Z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16v2H4V6Zm0 5h16v2H4v-2Zm0 5h16v2H4v-2Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm-1-5h2v3h-2V2Zm0 17h2v3h-2v-3ZM2 11h3v2H2v-2Zm17 0h3v2h-3v-2ZM4.93 6.34l1.41-1.41 2.12 2.12-1.41 1.41-2.12-2.12Zm10.6 10.6 1.41-1.41 2.12 2.12-1.41 1.41-2.12-2.12ZM5.93 18.07l2.12-2.12 1.41 1.41-2.12 2.12-1.41-1.41ZM15.54 7.05l2.12-2.12 1.41 1.41-2.12 2.12-1.41-1.41Z"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.7 14.5A8.5 8.5 0 0 1 9.5 3.3a8.5 8.5 0 1 0 11.2 11.2Z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M7 10V8a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1Zm2 0h6V8a3 3 0 0 0-6 0v2Z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Zm-1 7h2v5h-2v-5Zm0 6h2v2h-2v-2Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m9.5 16.2-3.7-3.7L4.4 14l5.1 5.1L20 8.6l-1.4-1.4-9.1 9Z"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.41l-8.3 8.3-1.4-1.42L17.59 5H14V3ZM5 5h6v2H6v11h11v-5h2v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Tables">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><g fill="currentColor"><rect x="7" y="7" width="18" height="18"/><rect x="7" y="7" width="18" height="18" transform="rotate(45 16 16)"/></g><circle cx="16" cy="16" r="3" fill="var(--sidebar-bg)"/></svg>
      <div class="brand__text"><strong>Saray</strong><span>Data Studio</span></div>
      <button class="icon-btn sidebar-close" type="button" id="sidebarClose" aria-label="Close menu"><svg class="ico"><use href="#i-close"/></svg></button>
    </div>
    <label class="side-search">
      <svg class="ico"><use href="#i-search"/></svg>
      <input id="tableFilter" type="search" placeholder="Filter tables…" autocomplete="off" aria-label="Filter tables">
    </label>
    <nav class="side-nav" id="tableNav"></nav>
    <div class="side-foot">
      <a href="{% url 'admin:index' %}"><svg class="ico"><use href="#i-external"/></svg>Django admin</a>
      <a href="/" target="_blank" rel="noopener"><svg class="ico"><use href="#i-external"/></svg>View website</a>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" type="button" id="menuBtn" aria-label="Open tables"><svg class="ico"><use href="#i-menu"/></svg></button>
      <div class="crumbs" id="crumbs"><span>Overview</span></div>
      <div class="topbar__right">
        <span class="hint-kbd" aria-hidden="true"><kbd>/</kbd> search <kbd>N</kbd> new</span>
        <button class="icon-btn" type="button" id="themeBtn" aria-label="Toggle light / dark theme"><svg class="ico"><use href="#i-moon"/></svg></button>
        <span class="user-chip" title="Signed in as {{ request.user.get_username }}">{{ request.user.get_username|slice:":1"|upper }}</span>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle" hidden>
  <div class="drawer__panel" role="dialog" aria-modal="true">
    <header class="drawer__head">
      <div>
        <h2 id="drawerTitle">Edit row</h2>
        <p id="drawerSub"></p>
      </div>
      <button class="icon-btn" type="button" id="drawerClose" aria-label="Close panel"><svg class="ico"><use href="#i-close"/></svg></button>
    </header>
    <form class="drawer__body" id="drawerForm" novalidate enctype="multipart/form-data"></form>
    <footer class="drawer__foot" id="drawerFoot"></footer>
  </div>
</aside>

<dialog class="confirm" id="confirm" aria-labelledby="confirmTitle">
  <form method="dialog">
    <div class="confirm__icon" id="confirmIcon"><svg class="ico"><use href="#i-alert"/></svg></div>
    <h2 id="confirmTitle"></h2>
    <div class="confirm__body" id="confirmBody"></div>
    <div class="confirm__actions" id="confirmActions"></div>
  </form>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="{% static 'studio/studio.js' %}"></script>
</body>
</html>
